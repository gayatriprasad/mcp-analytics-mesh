[project]
name = "infra-utils"
version = "0.1.0"
description = "Infrastructure utilities (data loaders, migrations, scripts)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "requests>=2.31",
  "psycopg[binary]>=3.1",
  "openpyxl>=3.1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/infra_utils"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"